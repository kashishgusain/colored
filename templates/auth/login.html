{% extends "base.html" %}
{% block title %}Log in — LOKVAANI AI{% endblock %}
{% block content %}
<section class="section" style="border-top:none;">
  <div class="container">
    <div class="form-card">
      <h2>Log in</h2>
      <p class="text-muted">Demo accounts (after running <code>seed_data.py</code>):
        <br><code>admin / admin123</code> — <code>steward / steward123</code> — <code>holder / holder123</code></p>
      <form method="post">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
      <p class="text-muted" style="margin-top:1.25rem;">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </div>
  </div>
</section>
{% endblock %}
